<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` for notch handling. Zoom is deliberately NOT
         disabled: the Stitch export set `user-scalable=no`, which blocks
         pinch zoom and fails WCAG 1.4.4. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#121319" />
    <title>Devyora</title>
    <meta
      name="description"
      content="Devyora — a personal AI voice assistant built around one consistent orb."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
